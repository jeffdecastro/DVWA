name: Security Scan

# Reporting-only security telemetry pipeline: Semgrep + Trivy (static) and
# Nuclei (dynamic, against a DVWA instance built and booted from this
# checkout, backed by a mariadb container per compose.yml), followed by a
# Gemini-generated, CWE-aware, risk-prioritized PR comment via
# jeffdecastro/security-pipeline-shared. This workflow must never modify
# repository files, and must never fail the build based on findings — see
# continue-on-error below on every build/boot/scan/report step. Separate
# from this fork's existing upstream CI (codeql-analysis.yml,
# shiftleft-analysis.yml, docker-image.yml, pytest.yml), which is left
# untouched.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read
  security-events: write

jobs:
  static-analysis:
    name: Static Analysis (Semgrep + Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Semgrep (PHP rulesets)
        continue-on-error: true
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942 \
            semgrep scan \
              --config=p/php \
              --config=p/security-audit \
              --config=p/owasp-top-ten \
              --config=p/cwe-top-25 \
              --sarif \
              --output=semgrep.sarif \
              --no-git-ignore \
              .

      - name: Run Trivy filesystem scan (composer.json + source)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Upload Semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-output
          path: semgrep.sarif
          if-no-files-found: warn

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-output
          path: trivy.sarif
          if-no-files-found: warn

  dynamic-scan:
    name: Dynamic Scan (Nuclei against live DVWA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build DVWA Docker image
        continue-on-error: true
        run: docker build -t dvwa-ci:${{ github.sha }} .

      - name: Start DVWA + database
        continue-on-error: true
        run: |
          docker network create dvwa-net
          docker run -d --name dvwa-db --network dvwa-net \
            -e MYSQL_ROOT_PASSWORD=dvwa \
            -e MYSQL_DATABASE=dvwa \
            -e MYSQL_USER=dvwa \
            -e MYSQL_PASSWORD=p@ssw0rd \
            mariadb:10
          docker run -d --name dvwa --network dvwa-net -p 4280:80 \
            -e DB_SERVER=dvwa-db \
            dvwa-ci:${{ github.sha }}
          for i in $(seq 1 40); do
            curl -sf http://localhost:4280/ && break
            sleep 5
          done

      - name: Run Nuclei against local DVWA instance
        continue-on-error: true
        run: |
          mkdir -p nuclei-results
          docker run --rm --network host \
            --platform linux/amd64 \
            -v "${{ github.workspace }}/nuclei-results:/output" \
            projectdiscovery/nuclei@sha256:8b82dfd56c02cbc47a6d328c58ff3292bfdb633e964f0f119b6d41d3a5ee33ef \
            -target http://localhost:4280 \
            -jsonl \
            -output /output/nuclei-results.json

      - name: Dump DVWA container logs on failure
        if: failure()
        continue-on-error: true
        run: |
          docker logs dvwa || true
          docker logs dvwa-db || true

      - name: Stop DVWA + database
        if: always()
        continue-on-error: true
        run: |
          docker rm -f dvwa dvwa-db || true
          docker network rm dvwa-net || true

      - name: Upload Nuclei results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nuclei-results
          path: nuclei-results/nuclei-results.json
          if-no-files-found: warn

  gemini-report:
    name: Gemini Report (dev-readable, risk-prioritized)
    if: always() && github.event_name == 'pull_request'
    needs: [static-analysis, dynamic-scan]
    uses: jeffdecastro/security-pipeline-shared/.github/workflows/gemini-report.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      pr_number: ${{ github.event.pull_request.number }}
      artifact_manifest: "semgrep-sarif=semgrep-output,trivy-sarif=trivy-output,nuclei-jsonl=nuclei-results"
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
